version: "3.9"

services:
  api:
    build: .
    container_name: todo_api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://todo_user:todo_pass@db:5432/todo_db
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: todo_db
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - todo_db_data:/var/lib/postgresql/data

volumes:
  todo_db_data:
